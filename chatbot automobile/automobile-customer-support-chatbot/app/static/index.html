
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Automobile Customer Support AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .chat-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: #12345a;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #dbeafe;
        }

        #messages {
            height: 430px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 14px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .bot {
            background: #f1f5f9;
            margin-right: auto;
        }

        .source {
            font-size: 12px;
            color: #64748b;
            margin-top: 7px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #e2e8f0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background: #12345a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media(max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 8px;
            }

            #messages {
                height: 65vh;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="chat-card">

            <div class="header">
                <h1>Automobile Customer Support AI</h1>
                <p>Powered by LangChain, RAG and Intent Recognition</p>
            </div>

            <div id="messages">
                <div class="message bot">
                    Hello! Welcome to Automobile Customer Support.
                    How can I help you with your vehicle today?
                </div>
            </div>

            <div class="input-area">

                <input
                    id="userInput"
                    type="text"
                    placeholder="Ask about maintenance, warranty, vehicle..."
                    maxlength="4000"
                >

                <button id="sendButton" onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </div>

    <script>
        const input = document.getElementById("userInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, type, sources = []) {

            const wrapper = document.createElement("div");
            wrapper.className = "message " + type;

            const content = document.createElement("div");
            content.textContent = text;

            wrapper.appendChild(content);

            if (sources.length > 0) {

                const sourceBox = document.createElement("div");
                sourceBox.className = "source";

                sourceBox.textContent = "Sources: " + sources.map(
                    source =>
                        source.source + " (page " + source.page + ")"
                ).join(", ");

                wrapper.appendChild(sourceBox);
            }

            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {

            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            input.value = "";
            sendButton.disabled = true;

            try {

                const response = await fetch("/api/chat", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Request failed"
                    );
                }

                addMessage(
                    data.answer,
                    "bot",
                    data.sources || []
                );

            } catch (error) {

                addMessage(
                    "Sorry, something went wrong: " + error.message,
                    "bot"
                );

            } finally {

                sendButton.disabled = false;
                input.focus();

            }
        }

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });
    </script>

</body>
</html>
